name: Validate Diagnostic Hub
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --diff .
      - run: python scripts/check_project.py
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_check.py
      - run: python scripts/browser_check.py --legacy-webview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: reports/
  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform ${{ matrix.platform }} --build-arg BUILD_ARCH=${{ matrix.arch }} --load -t diagnostic-hub:test diagnostic_hub
      - run: docker run --rm --platform ${{ matrix.platform }} -i diagnostic-hub:test python - < scripts/container_smoke.py
